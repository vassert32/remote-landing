# Превью: GitHub Pages, https://vassert32.github.io/remote-landing/
# Собирает ветку preview — безопасная песочница перед выкаткой на прод.
# Порядок работы: правки в preview → смотрим здесь → мёрж в main → прод.
# Прод живёт отдельным workflow (deploy.yml, ветка main).
name: pages-stage

on:
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Включить Pages у репозитория (первый запуск)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      - name: Сборка под подпапку стенда
        run: npx astro build
        env:
          DEPLOY_SITE: https://vassert32.github.io
          # Без ведущего слэша: см. комментарий в astro.config.mjs
          DEPLOY_BASE: remote-landing

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
