# Прод: https://remote-mentor.ru
# Каждый пуш в main собирает сайт и выкатывает его на сервер.
#
# Нужен один секрет репозитория: VPS_SSH_KEY — приватный ключ ed25519,
# публичная половина которого лежит в /root/.ssh/authorized_keys на сервере.
# Адрес и пользователь секретом не являются: IP и так виден в DNS домена.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VPS_HOST: 37.220.86.196
  VPS_USER: root
  VPS_PATH: /var/www/remote-landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Собирается под боевой домен: site в astro.config по умолчанию уже
      # remote-mentor.ru, поэтому переменные окружения тут не нужны.
      - name: Сборка
        run: npm run build

      - name: Ключ доступа
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # rsync на сервере не установлен, поэтому льём tar-потоком.
      # Каталог сносится целиком: файлы, которых больше нет в сборке,
      # должны исчезнуть и с прода.
      - name: Выкатка
        run: |
          tar czf - -C dist . | ssh -i ~/.ssh/deploy "$VPS_USER@$VPS_HOST" \
            "rm -rf $VPS_PATH && mkdir -p $VPS_PATH \
             && tar xzf - -C $VPS_PATH \
             && chown -R www-data:www-data $VPS_PATH \
             && find $VPS_PATH -type d -exec chmod 755 {} \; \
             && find $VPS_PATH -type f -exec chmod 644 {} \;"

      # Проверяем не только главную: 404 обязан отвечать 404, иначе где-то
      # снова включился SPA-фолбэк и поисковик начнёт есть мусор.
      - name: Проверка
        run: |
          curl --fail --retry 5 --retry-delay 2 -sSo /dev/null https://remote-mentor.ru/
          curl --fail --retry 3 -sSo /dev/null https://remote-mentor.ru/en/
          code=$(curl -s -o /dev/null -w '%{http_code}' https://remote-mentor.ru/definitely-not-a-page)
          test "$code" = "404" || { echo "битый адрес ответил $code вместо 404"; exit 1; }
          echo "прод отвечает, 404 честный"
