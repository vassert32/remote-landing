<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Три столбца роста дохода. Фон угольный, поэтому акцент берётся из
       тёмной полосы токенов (#ff9e5e): на 16px он читается заметно лучше
       светлополосного #d9531e. Раньше здесь жил #1F31D6 — лазурит из
       отвергнутой ультрамариновой палитры, переживший редизайн. -->
  <rect width="32" height="32" fill="#12120F"/>
  <rect x="5" y="20" width="5" height="7" fill="#F2F1ED"/>
  <rect x="13.5" y="15" width="5" height="12" fill="#F2F1ED"/>
  <rect x="22" y="6" width="5" height="21" fill="#FF9E5E"/>
</svg>
