# remote-mentor.ru — статический сайт, собранный Astro.
# Корень: /var/www/remote-landing. Выкладка — tar-потоком по ssh (DEPLOY.md).

# HTTP: всё уводим на https, включая www.
server {
    listen 80;
    listen [::]:80;

    server_name remote-mentor.ru www.remote-mentor.ru;

    return 301 https://remote-mentor.ru$request_uri;
}

# HTTPS на www: отдельный редирект на апекс.
# Раньше www не был указан ни в одном server_name, и nginx отдавал по нему
# тот же сайт как на дефолтном сервере — поисковик видел два адреса
# с одинаковым содержимым. Сертификат покрывает оба имени.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.remote-mentor.ru;

    ssl_certificate /etc/nginx/ssl/remote-mentor/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/remote-mentor/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://remote-mentor.ru$request_uri;
}

server {
    # http2 включён явно: на HTTP/1.1 браузер тянул ассеты в шесть
    # соединений, а у нас три шрифта и несколько css.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name remote-mentor.ru;

    ssl_certificate /etc/nginx/ssl/remote-mentor/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/remote-mentor/certificate.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/remote-landing;
    index index.html;

    # gzip в nginx.conf включён, но по умолчанию он жмёт ТОЛЬКО text/html.
    # Без этого списка css и js ехали несжатыми (13.7 КБ вместо 4.2 КБ).
    gzip_types text/css application/javascript image/svg+xml application/json
               application/manifest+json text/plain;
    gzip_min_length 512;
    gzip_vary on;

    # ВАЖНО: add_header НЕ наследуется, если во вложенном location есть свой
    # add_header — он сбрасывает все родительские. Поэтому заголовки
    # безопасности повторяются в каждом блоке, а не заданы один раз выше.

    # Битый адрес обязан отвечать 404, а не отдавать главную с кодом 200:
    # иначе поисковик индексирует несуществующие страницы как копии главной.
    location / {
        try_files $uri $uri/ =404;

        # Разметку не кэшируем: выкладка должна быть видна сразу.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Хэш в имени файла => содержимое неизменно. Год и immutable: браузер
    # не переспрашивает их вообще, повторный заход открывается мгновенно.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Эти имена без хэша и могут меняться при обновлении: сутки.
    location ~* \.(svg|jpg|jpeg|png|webp|ico)$ {
        expires 1d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
